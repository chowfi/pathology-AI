[project]
name = "luad-fm-fusion"
version = "0.1.0"
description = "Foundation-model fusion for lung adenocarcinoma growth-pattern classification"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0.15",
    "huggingface-hub>=0.30",
    "numpy",
    "pillow",
    "scikit-learn",
    "pandas",
    "transformers==4.51.3",
    "einops>=0.8.2",
    "safetensors>=0.8.0",
    "pyyaml>=6",
    "tifffile>=2025.1,<2026.10",
    "imagecodecs>=2025.1,<2026.10",
    "requests>=2.32",
    "scikit-image>=0.24,<0.26",
    "h5py>=3.11,<3.16",
    "anthropic>=2.3,<2.4",
    "python-dotenv>=1.2,<1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
